# Regenerates the gh-ascii profile card (https://gh.crafter.run) and adds the
# custom lines from card-lines.json. Runs daily so stats stay current, and on
# any change to card-lines.json so edits to the text show up right away.
#
# To change the card's custom text: edit card-lines.json and push.
# To change the portrait: replace portraits/dark.txt and portraits/light.txt.
#
# Heads-up: GitHub disables scheduled workflows after 60 days of repository
# inactivity. If the card stops updating, re-enable it from the Actions tab.

name: Refresh profile card

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - card-lines.json
      - portraits/**
      - scripts/customize_card.py
      - .github/workflows/refresh-card.yml

permissions:
  contents: write

concurrency:
  group: refresh-profile-card
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download both themes from gh-ascii
        env:
          HANDLE: DuchPanhathun
          GH_ASCII_URL: https://gh.crafter.run
          COLS: "100"
          # The portrait itself comes from portraits/<theme>.txt (a saved
          # gh-ascii render), because gh-ascii's background removal gives a
          # different picture from run to run. "keep" skips that slow step.
          # Delete the portraits/ files to use gh-ascii's live portrait.
          BG: keep
        run: |
          curl -fsSL --retry 3 --retry-delay 5 "$GH_ASCII_URL/$HANDLE?theme=dark&cols=$COLS&bg=$BG" -o dark_mode.svg
          curl -fsSL --retry 3 --retry-delay 5 "$GH_ASCII_URL/$HANDLE?theme=light&cols=$COLS&bg=$BG" -o light_mode.svg

      - name: Add custom lines
        run: python3 scripts/customize_card.py card-lines.json --portraits portraits dark_mode.svg light_mode.svg

      - name: Commit only if the card changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          if git diff --cached --quiet; then
            echo "Card unchanged — nothing to commit."
          else
            git commit -m "chore: refresh profile card"
            git push
          fi
